# Browser end-to-end tests against the production image. Started manually
# (Actions → E2E → Run workflow).
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Allow the test stack to write fixtures
        run: |
          echo "DOCNEST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCNEST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Install Playwright
        working-directory: e2e
        run: pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
      - name: Build dev image (for fixtures)
        run: docker build -f docker/Dockerfile --target dev -t docnest-dev .
      - name: Run end-to-end tests against the production image
        run: ./e2e/run-local.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7
