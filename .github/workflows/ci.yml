name: CI

# Runs on pull requests directly; pushes and release tags run it via
# preview.yml / release.yml before an image is published.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: docnest-dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
      - name: Start PostgreSQL
        run: |
          echo "DOCNEST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCNEST_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p frontend/dist
          docker compose -f deploy/compose.dev.yml up -d db
      - name: Lint
        run: docker compose -f deploy/compose.dev.yml run --rm dev sh -c "ruff check . && ruff format --check ."
      - name: Type check
        run: docker compose -f deploy/compose.dev.yml run --rm dev mypy apps docnest
      - name: Tests (incl. real OCR)
        run: docker compose -f deploy/compose.dev.yml run --rm dev pytest -q
      - name: OpenAPI schema is up to date
        run: |
          docker compose -f deploy/compose.dev.yml run --rm -v "$PWD/frontend:/out" dev \
            python manage.py export_openapi_schema --api docnest.api.web_api --output /out/openapi.json --indent 1
          git diff --exit-code frontend/openapi.json

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the schema
        run: pnpm api:types && git diff --exit-code src/api/schema.d.ts
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Allow the test stack to write fixtures
        run: |
          echo "DOCNEST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCNEST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Install Playwright
        working-directory: e2e
        run: pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
      - name: Build dev image (for fixtures)
        run: docker build -f docker/Dockerfile --target dev -t docnest-dev .
      - name: Run end-to-end tests against the production image
        run: ./e2e/run-local.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7
