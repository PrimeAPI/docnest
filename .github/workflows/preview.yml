# Every push to any branch: build and publish a preview image (no tests).
#   main      → ghcr.io/<owner>/docnest:edge
#   any branch → ghcr.io/<owner>/docnest:<branch> and :sha-<commit>
name: Preview

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/publish-image.yml
    with:
      kind: preview
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
