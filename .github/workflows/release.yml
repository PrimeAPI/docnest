# Version tag vX.Y.Z: build and publish
#   ghcr.io/<owner>/docnest:X.Y.Z, :X.Y and :latest
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/publish-image.yml
    with:
      kind: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release drafted in the GitHub UI creates the tag itself; keep it as is.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it unchanged."
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --notes "$(cat <<NOTES
          Docker image: \`ghcr.io/${OWNER}/docnest:${VERSION}\` (also \`:latest\`)

          Upgrade: \`docker compose pull && docker compose up -d\`
          NOTES
          )"
